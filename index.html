    return functionPerfStats.measure("drawActivePieceFrame", () => {
      if (!activePiece) {
        draw();
        return;
      }

      if (!dragLayerReady || dragLayerPiece !== activePiece) {
        buildDragStaticLayer(activePiece);
      }

      if (!dragLayerReady) {
        draw();
        return;
      }

      ctx.clearRect(0,0,W,H);
      ctx.drawImage(dragLayerCanvas, 0, 0, W, H);

      const targetBoardCells = getTargetBoardCellSet();
      drawPiece(ctx, activePiece, { boardCells: targetBoardCells });
    });
  }

  function drawDuringDrag() {
    return functionPerfStats.measure("drawDuringDrag", () => {
      drawDebugStats.dragDraw++;
      drawDebugStats.lastDragDrawAt = performance.now();
      const __dragFrameStart = performance.now();
      if (!drag || !drag.p) {
        draw();
        return;
      }

      drawActivePieceFrame(drag.p);
      const __dragFrameMs = performance.now() - __dragFrameStart;
      renderPerfStats.dragFrames++;
      renderPerfStats.dragFrameMs += __dragFrameMs;
      renderPerfStats.maxDragFrameMs = Math.max(renderPerfStats.maxDragFrameMs, __dragFrameMs);
    });
  }

  function drawSelectedPulseFrame() {
    return functionPerfStats.measure("drawSelectedPulseFrame", () => {
      const __selectedPulseStart = performance.now();
      if (!selected) {
        draw();
        return;
      }
      draw();
      const __selectedPulseMs = performance.now() - __selectedPulseStart;
      renderPerfStats.selectedPulseFrames++;
      renderPerfStats.selectedPulseMs += __selectedPulseMs;
      renderPerfStats.maxSelectedPulseMs = Math.max(renderPerfStats.maxSelectedPulseMs, __selectedPulseMs);
    });
  }

  function getActionAnimatingPiece() {
    return pieces.find(p => p.actionAnim) || null;
  }

  function drawActionAnimationFrame() {
    return functionPerfStats.measure("drawActionAnimationFrame", () => {
      const animPiece = getActionAnimatingPiece();
      if (!animPiece) {
        if (selected) drawSelectedPulseFrame();
        else draw();
        return;
      }

      // During rotate/flip animation, keep the board and other pieces cached and
      // redraw only the animating piece. Full redraw every frame is still too
      // expensive on mobile, even after simplifying the glass effects.
      drawActivePieceFrame(animPiece);
    });
  }

  function draw() {
    return functionPerfStats.measure("draw:full", () => {
      drawDebugStats.fullDraw++;
      drawDebugStats.lastFullDrawAt = performance.now();
      const __fullDrawStart = performance.now();
      if (pieces.some(p => p.actionAnim)) renderPerfStats.actionAnimationFrames++;
      ctx.clearRect(0,0,W,H);
      drawBoard();
      drawHintOutline();

      const targetBoardCells = getTargetBoardCellSet();
      const ordered = [...pieces];
      for (const p of ordered) drawPiece(ctx, p, { boardCells: targetBoardCells });

      if (!drag) drawAnswer();
      const __fullDrawMs = performance.now() - __fullDrawStart;
      renderPerfStats.fullDrawMs += __fullDrawMs;
      renderPerfStats.maxFullDrawMs = Math.max(renderPerfStats.maxFullDrawMs, __fullDrawMs);
    });
  }

  function needsAnimationLoop() {
    if (drag) return !!getActionAnimatingPiece() || hasCleared;
    return !!getActionAnimatingPiece() || hasCleared;
  }

  function requestDrawLoop() {
    if (animFrame) return;
    const requestedAt = performance.now();
    const eventFreshMs = 180;
    const rotateFreshMs = 1200;
    const rawMove = interactionPerfStats.lastPointerMoveAt || 0;
    const rawUp = interactionPerfStats.lastPointerUpAt || 0;
    const rawRotate = interactionPerfStats.lastRotateCommandAt || 0;
    const fromMove = rawMove && requestedAt - rawMove <= eventFreshMs ? rawMove : 0;
    const fromUp = rawUp && requestedAt - rawUp <= eventFreshMs ? rawUp : 0;
    const fromRotate = rawRotate && requestedAt - rawRotate <= rotateFreshMs ? rawRotate : 0;

    const step = () => {
      const frameStart = performance.now();

      if (fromMove) {
        interactionPerfStats.mark("pointermove->firstFrame", fromMove);
        if (interactionPerfStats.lastPointerMoveAt === fromMove) interactionPerfStats.lastPointerMoveAt = 0;
      }
      if (fromUp) {
        interactionPerfStats.mark("pointerup->firstFrame", fromUp);
        if (interactionPerfStats.lastPointerUpAt === fromUp) interactionPerfStats.lastPointerUpAt = 0;
      }
      if (fromRotate) {
        interactionPerfStats.mark("rotateCommand->firstFrame", fromRotate);
        if (interactionPerfStats.lastRotateCommandAt === fromRotate) interactionPerfStats.lastRotateCommandAt = 0;
      }
      interactionPerfStats.mark("requestDrawLoop->frame", requestedAt);

      animFrame = null;
      if (drag) drawDuringDrag();
      else if (getActionAnimatingPiece()) drawActionAnimationFrame();
      else if (selected) drawSelectedPulseFrame();
      else draw();

      interactionPerfStats.mark("frameCallbackBody", frameStart);
      if (needsAnimationLoop()) requestDrawLoop();
    };
    animFrame = requestAnimationFrame(step);
  }

  function animatePieceAction(piece, type, dir = 1) {
    const __start = performance.now();
    if (!piece) return;
    if (type === "rotate") interactionPerfStats.lastRotateCommandAt = __start;
    clearDragStaticLayer();
    piece.actionAnim = {
      type,
      dir,
      start: performance.now(),
      duration: type === "flip" ? 430 : 330
    };
    requestDrawLoop();
    interactionPerfStats.mark(`animatePieceAction:${type}`, __start);
  }

  function pick(x, y) {
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      const centers = transformedLocalHexCenters(p, false, p.hexSize);
      for (const c of centers) {
        const dx = x - (p.x + c.x);
        const dy = y - (p.y + c.y);
        if (Math.hypot(dx, dy) <= p.hexSize * 1.02) return p;
      }
    }
    return null;
  }

  function snapPieceToGrid(p) {
    const centroid = orientedCentroidOffset(p, false, p.hexSize);
    const snapped = pixelToAxial(
      p.x - p.targetX - centroid.x,
      p.y - p.targetY - centroid.y,
      p.hexSize
    );
    const center = pieceCenterForGridOrigin(p, snapped, false, p.hexSize);
    p.origin = snapped;
    p.x = center.x;
    p.y = center.y;
  }

  function rotationEquivalentToTarget(p) {
    const currentCells = transformedCells(p, false).map(axialKey).sort().join(";");
    const targetCells = transformedCells(p, true).map(axialKey).sort().join(";");
    return currentCells === targetCells;
  }

  function isBoardCoverageSolved() {
    if (!pieces.length) return false;

    const targetCells = getTargetBoardCellSet();
    const currentCells = new Set();

    for (const p of pieces) {
      for (const c of transformedCells(p, false)) {
        const key = axialKey(c);
        // If two pieces overlap, the Set size will be too small at the end.
        currentCells.add(key);
      }
    }

    const expectedCellCount = pieces.reduce((sum, p) => sum + p.baseCells.length, 0);
    if (currentCells.size !== expectedCellCount) return false;
    if (currentCells.size !== targetCells.size) return false;

    for (const key of currentCells) {
      if (!targetCells.has(key)) return false;
    }

    return true;
  }

  function hasPieceOverlap(piece) {
    const ownCells = new Set(transformedCells(piece, false).map(axialKey));
    for (const other of pieces) {
      if (other === piece) continue;
      for (const key of transformedCells(other, false).map(axialKey)) {
        if (ownCells.has(key)) return true;
      }
    }
    return false;
  }

  function canPlacePieceAtOrigin(piece, origin) {
    const occupied = new Set();
    for (const other of pieces) {
      if (other === piece) continue;
      for (const key of transformedCells(other, false).map(axialKey)) occupied.add(key);
    }

    const previousOrigin = piece.origin;
    piece.origin = { ...origin };
    const cells = transformedCells(piece, false);
    piece.origin = previousOrigin;

    return cells.every(c => !occupied.has(axialKey(c)));
  }

  function placePieceAtOrigin(piece, origin) {
    piece.origin = { ...origin };
    const center = pieceCenterForGridOrigin(piece, piece.origin, false, piece.hexSize);
    piece.x = center.x;
    piece.y = center.y;
    piece.solved = rotationEquivalentToTarget(piece);
  }

  function nudgePieceAwayFromOverlap(piece) {
    if (!hasPieceOverlap(piece)) return true;

    const base = { ...piece.origin };
    const candidates = [];
    const seen = new Set();
    const push = (origin, radius) => {
      const key = axialKey(origin);
      if (seen.has(key)) return;
      seen.add(key);
      const center = pieceCenterForGridOrigin(piece, origin, false, piece.hexSize);
      candidates.push({
        origin,
        radius,
        distance: Math.hypot(center.x - piece.x, center.y - piece.y)
      });
    };

    push(base, 0);
    for (let radius = 1; radius <= 14; radius++) {
      for (let dq = -radius; dq <= radius; dq++) {
        for (let dr = -radius; dr <= radius; dr++) {
          const ds = -dq - dr;
          if (Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds)) !== radius) continue;
          push({ q: base.q + dq, r: base.r + dr }, radius);
        }
      }
    }

    candidates.sort((a, b) => a.radius - b.radius || a.distance - b.distance);
    const open = candidates.find(candidate => canPlacePieceAtOrigin(piece, candidate.origin));
    if (!open) return false;

    placePieceAtOrigin(piece, open.origin);
    return true;
  }

  function capturePieceState(piece) {
    return {
      x: piece.x,
      y: piece.y,
      origin: { ...piece.origin },
      rot: piece.rot,
      flip: piece.flip,
      solved: !!piece.solved
    };
  }

  function restorePieceState(piece, state) {
    if (!piece || !state) return;
    piece.x = state.x;
    piece.y = state.y;
    piece.origin = { ...state.origin };
    piece.rot = state.rot;
    piece.flip = state.flip;
    piece.solved = !!state.solved;
  }

  function rejectOverlapOrSave(piece, previousState) {
    const hadOverlap = hasPieceOverlap(piece);
    if (hadOverlap && !nudgePieceAwayFromOverlap(piece)) {
      restorePieceState(piece, previousState);
      piece.actionAnim = null;
      statusEl.textContent = "ピースは重ねられません";
      return false;
    }
    if (hadOverlap) {
      statusEl.textContent = "ピースが重ならない近くの位置へずらしました";
    }
    saveCurrentPuzzleState();
    return true;
  }

  function trySnapToTarget(p) {
    snapPieceToGrid(p);
    const closeOrigin = p.origin.q === p.targetOrigin.q && p.origin.r === p.targetOrigin.r;
    const targetCenter = pieceCenterForGridOrigin(p, p.targetOrigin, false, p.hexSize);
    const nearScreen = Math.hypot(p.x - targetCenter.x, p.y - targetCenter.y) < p.hexSize * .28;

    if (!closeOrigin && !nearScreen) {
      p.solved = false;
      return;
    }

    // Snap only the position to the target grid origin.
    // Rotation and flip must be changed only by explicit user actions.
    p.origin = { ...p.targetOrigin };
    const center = pieceCenterForGridOrigin(p, p.origin, false, p.hexSize);
    p.x = center.x;
    p.y = center.y;
    p.solved = rotationEquivalentToTarget(p);
  }

  function checkClear() {
    const all = isBoardCoverageSolved();
    if (all) {
      for (const p of pieces) p.solved = true;
      if (!hasCleared) {
        hasCleared = true;
        const result = grantClearXp(selectedPieceCount);
      console.log("[clear reward]", {
        selectedPieceCount,
        usedHints: result.usedHints,
        rewardPieceCount: result.rewardPieceCount,
        gainedXp: result.gainedXp
      });
      const rankedUp = result.unlockedNewPiece;
      playSound(rankedUp ? "rankup" : "clear");

      clearPopup.classList.toggle("rank-up", rankedUp);
      if (clearTitle) clearTitle.textContent = rankedUp ? "Rank Up!" : "Clear!";
      clearText.textContent = rankedUp
        ? `New: ${result.newMax} Pieces`
        : getRandomClearMessage();

      if (rankedUp && xpPanel) {
        xpPanel.classList.remove("rank-flash");
        void xpPanel.offsetWidth;
        xpPanel.classList.add("rank-flash");
      }

      clearPopup.classList.add("show");
        statusEl.textContent = result.unlockedNewPiece
          ? `New unlock: ${result.newMax} Pieces!`
          : `${levelName()} Clear!`;
        requestDrawLoop();
      }
    } else {
      hasCleared = false;
      for (const p of pieces) p.solved = rotationEquivalentToTarget(p);
      clearPopup.classList.remove("show");
      const spec = getCurrentSpec();
      statusEl.textContent = `${selectedPieceCount} Pieces ${spec.band}`;
      updateXpUI();
    }
  }

  function resetPieces() {
    clearPopup.classList.remove("show");
    hasCleared = false;
    hintPieceId = null;
    hintedPieceIds.clear();
    for (const p of pieces) {
      p.x = p.startX;
      p.y = p.startY;
      p.origin = { ...p.startOrigin };
      p.rot = p.startRot;
      p.flip = p.startFlip;
      p.solved = false;
    }
    selected = null;
    clearDragStaticLayer();
    saveCurrentPuzzleState();
    draw();
    checkClear();
  }

  function clearLongPressTimer() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  }

  function flipSelected() {
    if (!selected) {
      statusEl.textContent = "先にピースを1つ選択してください";
      return;
    }
    const before = capturePieceState(selected);
    selected.flip = selected.flip ? 0 : 1;
    animatePieceAction(selected, "flip", 1);
    playSound("flip");
    trySnapToTarget(selected);
    if (!rejectOverlapOrSave(selected, before)) {
      clearDragStaticLayer();
      draw();
      return;
    }
    checkClear();
    if (getActionAnimatingPiece()) drawActionAnimationFrame();
    else draw();
  }

  function showHint() {
    if (!pieces.length || hasCleared) return;

    const candidates = pieces.filter(p => !rotationEquivalentToTarget(p));
    const pool = candidates.length ? candidates : pieces;
    if (!pool.length) return;

    const currentIndex = pool.findIndex(p => p.id === hintPieceId);
    const nextPiece = pool[(currentIndex + 1 + pool.length) % pool.length];
    const wasAlreadyHinted = hintedPieceIds.has(nextPiece.id);

    hintPieceId = nextPiece.id;
    hintedPieceIds.add(nextPiece.id);

    if (!wasAlreadyHinted) {
      hintUseCount++;
      console.log("[hint used]", {
        selectedPieceCount,
        hintUseCount,
        rewardPieceCount: getEffectiveRewardPieceCount(selectedPieceCount, hintUseCount)
      });
    }

    selected = nextPiece;
    nextPiece.pulseStart = performance.now();
    clearDragStaticLayer();

    saveCurrentPuzzleState();
    draw();
    requestDrawLoop();
  }

  function setSoundEnabled(enabled, persist = true) {
    soundEnabled = !!enabled;
    if (soundSwitch) soundSwitch.dataset.value = soundEnabled ? "on" : "off";
    if (gameSoundSwitch) gameSoundSwitch.dataset.value = soundEnabled ? "on" : "off";
    if (soundOnBtn) soundOnBtn.classList.toggle("active", soundEnabled);
    if (soundOffBtn) soundOffBtn.classList.toggle("active", !soundEnabled);
    if (gameSoundOnBtn) gameSoundOnBtn.classList.toggle("active", soundEnabled);
    if (gameSoundOffBtn) gameSoundOffBtn.classList.toggle("active", !soundEnabled);
    if (soundOnBtn) soundOnBtn.setAttribute("aria-pressed", String(soundEnabled));
    if (soundOffBtn) soundOffBtn.setAttribute("aria-pressed", String(!soundEnabled));
    if (gameSoundOnBtn) gameSoundOnBtn.setAttribute("aria-pressed", String(soundEnabled));
    if (gameSoundOffBtn) gameSoundOffBtn.setAttribute("aria-pressed", String(!soundEnabled));
    if (persist) localStorage.setItem(SOUND_STATE_KEY, soundEnabled ? "on" : "off");
  }

  function toggleSound() {
    setSoundEnabled(!soundEnabled);
  }

  function normalizeTheme(value) {
    return value === "light" ? "light" : "dark";
  }

  function setTheme(theme, persist = true) {
    const nextTheme = normalizeTheme(theme);
    document.body.classList.toggle("light-theme", nextTheme === "light");
    document.body.classList.toggle("dark-theme", nextTheme === "dark");
    if (themeSwitch) themeSwitch.dataset.value = nextTheme;
    if (gameThemeSwitch) gameThemeSwitch.dataset.value = nextTheme;

    if (lightModeBtn) lightModeBtn.classList.toggle("active", nextTheme === "light");
    if (darkModeBtn) darkModeBtn.classList.toggle("active", nextTheme === "dark");
    if (lightModeBtn) lightModeBtn.setAttribute("aria-pressed", String(nextTheme === "light"));
    if (darkModeBtn) darkModeBtn.setAttribute("aria-pressed", String(nextTheme === "dark"));

    if (persist) {
      try { localStorage.setItem(THEME_STATE_KEY, nextTheme); } catch (err) {}
    }
  
    // Theme changes affect canvas colors and cached drag/static layers.
    // Redraw immediately to avoid a one-frame flash from the previous theme.
    clearDragStaticLayer();
    if (ctx && W && H) ctx.clearRect(0, 0, W, H);
    if (pieces.length) {
      draw();
      if (showAnswer) drawAnswer();
      requestDrawLoop();
    }
}

  function toggleTheme() {
    setTheme(document.body.classList.contains("light-theme") ? "dark" : "light");
  }


  function loadTheme() {
    let savedTheme = "dark";
    try { savedTheme = localStorage.getItem(THEME_STATE_KEY) || "dark"; } catch (err) {}
    setTheme(savedTheme, false);
  }

  function toggleSettingsPanel() {
    if (!settingsPanel || !settingsBtn) return;
    const show = !settingsPanel.classList.contains("show");
    settingsPanel.classList.toggle("show", show);
    settingsPanel.setAttribute("aria-hidden", String(!show));
    settingsBtn.setAttribute("aria-expanded", String(show));
  }

  function closeGameSettingsPanel() {
    if (!gameSettingsPanel) return;
    gameSettingsPanel.classList.remove("show");
    if (gameSettingsBtn) gameSettingsBtn.setAttribute("aria-expanded", "false");
    gameSettingsPanel.setAttribute("aria-hidden", "true");
  }

  function toggleGameSettingsPanel() {
    if (!gameSettingsPanel || !gameSettingsBtn) return;

    settingsPanel.classList.remove("show");
    settingsBtn.setAttribute("aria-expanded", "false");
    settingsPanel.setAttribute("aria-hidden", "true");

    gameSettingsPanel.classList.toggle("show");
    const open = gameSettingsPanel.classList.contains("show");
    gameSettingsBtn.setAttribute("aria-expanded", String(open));
    gameSettingsPanel.setAttribute("aria-hidden", String(!open));
  }


  function showHome() {
    document.body.classList.remove("game-mode");
    document.body.classList.add("home-mode");
    if (pieceMenu) pieceMenu.classList.remove("show");
  }

  function startGame() {
    document.body.classList.remove("home-mode");
    document.body.classList.add("game-mode");
    requestAnimationFrame(() => {
      resize();
      if (!pieces.length) regenerate(false);
      draw();
    });
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x:e.clientX - r.left, y:e.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", e => {
    unlockSounds();
    canvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    const p = pick(pos.x, pos.y);
    if (!p) return;
    playSound("pick");

    clearPopup.classList.remove("show");
    selected = p;
    pieces = pieces.filter(q => q !== p);
    pieces.push(p);

    clearLongPressTimer();

    drag = {
      p,
      x0:pos.x,
      y0:pos.y,
      px:p.x,
      py:p.y,
      before: capturePieceState(p),
      moved:false,
      longPressed:false,
      time:performance.now()
    };

    longPressTimer = setTimeout(() => {
      if (!drag || drag.p !== p || drag.moved) return;
      drag.longPressed = true;
      p.flip = p.flip ? 0 : 1;
      animatePieceAction(p, "flip", 1);
      trySnapToTarget(p);
      if (!rejectOverlapOrSave(p, drag.before)) {
        clearDragStaticLayer();
        draw();
        return;
      }
      checkClear();
      drawDuringDrag();
    }, LONG_PRESS_MS);

    canvas.classList.add("grabbing");
    // TEMP DIAGNOSIS:
    // Do not build the heavy drag static layer immediately on pointerdown.
    // This checks whether the shared 1-second lag comes from synchronous layer building.
    // buildDragStaticLayer(p);
    // drawDuringDrag();
    // requestDrawLoop();
    draw();
  });

  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const pos = getPos(e);
    const dx = pos.x - drag.x0;
    const dy = pos.y - drag.y0;
    if (Math.hypot(dx, dy) > 6) {
      const wasMoved = drag.moved;
      drag.moved = true;
      clearLongPressTimer();
      if (!wasMoved) clearDragStaticLayer();
    }
    drag.p.x = drag.px + dx;
    drag.p.y = drag.py + dy;
    drag.p.solved = false;
    drawDuringDrag();
  });

  canvas.addEventListener("pointerup", e => {
    unlockSounds();
    if (!drag) return;
    clearLongPressTimer();
    const p = drag.p;
    if (!drag.longPressed && !drag.moved && performance.now() - drag.time < 360) {
      p.rot = (p.rot + 1) % 6;
      animatePieceAction(p, "rotate", 1);
      playSound("flip");
      drag = null;
      canvas.classList.remove("grabbing");
      clearDragStaticLayer();
      drawActionAnimationFrame();
      return;
    }
    trySnapToTarget(p);
    if (!rejectOverlapOrSave(p, drag.before)) {
      drag = null;
      canvas.classList.remove("grabbing");
      clearDragStaticLayer();
      draw();
      return;
    }
    playSound("put");
    checkClear();
    drag = null;
    canvas.classList.remove("grabbing");
    if (getActionAnimatingPiece()) drawActionAnimationFrame();
    else draw();
  });

  canvas.addEventListener("pointercancel", () => {
    clearLongPressTimer();
    clearDragStaticLayer();
    drag = null;
    canvas.classList.remove("grabbing");
    draw();
  });

  playBtn.addEventListener("click", startGame);
  settingsBtn.addEventListener("click", e => {
    e.stopPropagation();
    toggleSettingsPanel();
  });
  if (gameSettingsBtn) gameSettingsBtn.addEventListener("click", e => {
    e.stopPropagation();
    toggleGameSettingsPanel();
  });
  settingsPanel.addEventListener("click", e => e.stopPropagation());
  if (gameSettingsPanel) gameSettingsPanel.addEventListener("click", e => e.stopPropagation());
  lightModeBtn.addEventListener("click", toggleTheme);
  darkModeBtn.addEventListener("click", toggleTheme);
  if (themeSwitch) themeSwitch.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    toggleTheme();
  });
  if (soundOnBtn) soundOnBtn.addEventListener("click", toggleSound);
  if (soundOffBtn) soundOffBtn.addEventListener("click", toggleSound);
  if (soundSwitch) soundSwitch.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    toggleSound();
  });
  if (gameLightModeBtn) gameLightModeBtn.addEventListener("click", toggleTheme);
  if (gameDarkModeBtn) gameDarkModeBtn.addEventListener("click", toggleTheme);
  if (gameThemeSwitch) gameThemeSwitch.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    toggleTheme();
  });
  if (gameSoundOnBtn) gameSoundOnBtn.addEventListener("click", toggleSound);
  if (gameSoundOffBtn) gameSoundOffBtn.addEventListener("click", toggleSound);
  if (gameSoundSwitch) gameSoundSwitch.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    toggleSound();
  });
  backBtn.addEventListener("click", showHome);
  document.getElementById("hintBtn").addEventListener("click", showHint);
  document.getElementById("flipBtn").addEventListener("click", flipSelected);
  document.getElementById("resetBtn").addEventListener("click", resetPieces);
  document.getElementById("newBtn").addEventListener("click", () => regenerate(true));
  document.getElementById("nextBtn").addEventListener("click", () => regenerate(true));
  document.getElementById("pieceDownBtn").addEventListener("click", () => setSelectedPieceCount(selectedPieceCount - 1, true));
  document.getElementById("pieceBtn").addEventListener("click", e => {
    e.stopPropagation();
    renderPieceMenu();
    pieceMenu.classList.toggle("show");
  });

  xpPanel.addEventListener("click", e => {
    e.stopPropagation();
    renderPieceMenu();
    pieceMenu.classList.toggle("show");
  });

  if (pieceMenu) {
    pieceMenu.addEventListener("click", e => e.stopPropagation());
  }

  document.addEventListener("click", () => {    if (pieceMenu) pieceMenu.classList.remove("show");
    if (settingsPanel && settingsPanel.classList.contains("show")) toggleSettingsPanel();  });
  document.addEventListener("pointerdown", e => {
    if (!gameSettingsPanel || !gameSettingsPanel.classList.contains("show")) return;
    if (gameSettingsPanel.contains(e.target)) return;
    if (gameSettingsBtn && gameSettingsBtn.contains(e.target)) return;
    closeGameSettingsPanel();
  }, true);

  document.getElementById("pieceUpBtn").addEventListener("click", () => setSelectedPieceCount(selectedPieceCount + 1, true));
  document.getElementById("answerBtn").addEventListener("click", e => {
    showAnswer = !showAnswer;
    e.currentTarget.textContent = showAnswer ? "Hide" : "Show";
    draw();
  });

  window.addEventListener("keydown", e => {
    if (!selected) return;
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;

    e.preventDefault();
    clearPopup.classList.remove("show");
    const before = capturePieceState(selected);

    if (e.key === "ArrowRight") {
      selected.rot = (selected.rot + 1) % 6;
      animatePieceAction(selected, "rotate", 1);
    } else {
      selected.rot = (selected.rot + 5) % 6;
      animatePieceAction(selected, "rotate", -1);
    }

    trySnapToTarget(selected);
    if (!rejectOverlapOrSave(selected, before)) {
      clearDragStaticLayer();
      draw();
      return;
    }
    checkClear();
    if (getActionAnimatingPiece()) drawActionAnimationFrame();
    else draw();
  });

  function resize() {
    const rect = stageCard.getBoundingClientRect();
    if (rect.width < 20 || rect.height < 20) return;
    dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    clearDragStaticLayer();

    answerCanvas.width = Math.floor((answerCanvas.clientWidth || 144) * dpr);
    answerCanvas.height = Math.floor((answerCanvas.clientHeight || 116) * dpr);
    ansCtx.setTransform(dpr,0,0,dpr,0,0);

    if (!pieces.length) regenerate();
    else {
      const snapshot = serializeCurrentPuzzle();
      if (snapshot) buildPiecesFromSnapshot(snapshot);
      draw();
    }
  }

  // XP/Unlock table and player state
  const UNLOCK_XP_TABLE = buildUnlockXpTable(80);

  playerState = loadPlayerState();
  selectedPieceCount = Math.max(
    PIECE_SELECT_MIN,
    Math.min(
      playerState.selectedPieceCount || playerState.maxUnlockedPieces || PIECE_SELECT_MIN,
      PIECE_SELECT_MAX
    )
  );

  window.__hexaPuzzleDebug = {
    interactionPerf: interactionPerfStats,
    resetInteractionPerf: () => interactionPerfStats.reset(),
    interactionPerfSummary: () => interactionPerfStats.summary(),
    interactionPerfLog: () => interactionPerfStats.log(),
    interactionPerfRecent: (limit = 60) => interactionPerfStats.recent(limit),

    perf: functionPerfStats,
    resetPerf: () => functionPerfStats.reset(),
    perfSummary: () => functionPerfStats.summary(),
    perfLog: () => functionPerfStats.log(),
    setPerfEnabled: value => { functionPerfStats.enabled = !!value; return functionPerfStats.enabled; },

    get pentahexCount() { return PENTAS.length; },
    get pentahexes() { return PENTAS; },
    get pieces() { return pieces; },
    get hintedPieceIds() { return [...hintedPieceIds]; },
    get boardCoverageSolved() { return isBoardCoverageSolved(); },
    regenerate,
    canonicalSignature,
    get playerState() { return playerState; },
    get unlockXpTable() { return UNLOCK_XP_TABLE; },
    get level() { return getPlayerLevel(playerState.totalXp); },
    grantDebugXp(amount) {
      playerState.totalXp += Math.max(0, Number(amount || 0));
      playerState.maxUnlockedPieces = getMaxUnlockedPieces(playerState.totalXp);
      selectedPieceCount = Math.max(PIECE_SELECT_MIN, Math.min(selectedPieceCount, PIECE_SELECT_MAX));
      playerState.selectedPieceCount = selectedPieceCount;
      savePlayerState();
      updatePieceUI();
      regenerate(false);
    },
    resetProgress() {
      playerState = { totalXp:0, maxUnlockedPieces:PIECE_SELECT_MIN, selectedPieceCount:PIECE_SELECT_MIN, clearedCount:0, clearedByPiece:{} };
      selectedPieceCount = PIECE_SELECT_MIN;
      savePlayerState();
      updatePieceUI();
      regenerate(false);
    }
    ,
    get drawStats() { return { ...drawDebugStats, drag: !!drag, selected: !!selected, animFrame: !!animFrame, dragLayerReady }; },
    resetDrawStats() { drawDebugStats.reset(); },
    logDrawStatsEvery(ms = 1000) {
      if (window.__hexaDrawStatsTimer) clearInterval(window.__hexaDrawStatsTimer);
      let prevFull = drawDebugStats.fullDraw;
      let prevDrag = drawDebugStats.dragDraw;
      let prevBuild = drawDebugStats.buildDragLayer;
      window.__hexaDrawStatsTimer = setInterval(() => {
        const nowFull = drawDebugStats.fullDraw;
        const nowDrag = drawDebugStats.dragDraw;
        const nowBuild = drawDebugStats.buildDragLayer;
        console.log({
          fullDrawPerInterval: nowFull - prevFull,
          dragDrawPerInterval: nowDrag - prevDrag,
          buildDragLayerPerInterval: nowBuild - prevBuild,
          drag: !!drag,
          selected: !!selected,
          animFrame: !!animFrame,
          dragLayerReady
        });
        prevFull = nowFull;
        prevDrag = nowDrag;
        prevBuild = nowBuild;
      }, ms);
      return "draw stats logging started";
    },
    stopDrawStatsLog() {
      if (window.__hexaDrawStatsTimer) clearInterval(window.__hexaDrawStatsTimer);
      window.__hexaDrawStatsTimer = null;
      return "draw stats logging stopped";
    }
    ,
    get renderPerfStats() {
      return {
        ...renderPerfStats,
        fullDrawCount: drawDebugStats.fullDraw,
        dragDrawCount: drawDebugStats.dragDraw,
        activeAnimations: pieces.filter(p => p.actionAnim).length,
        selected: !!selected,
        drag: !!drag,
        dragLayerReady,
        dragLayerPieceId: dragLayerPiece ? dragLayerPiece.id : null
      };
    },
    resetRenderPerfStats() {
      renderPerfStats.reset();
      drawDebugStats.reset();
      return "render perf stats reset";
    },
    logRenderPerfEvery(ms = 1000) {
      if (window.__hexaRenderPerfTimer) clearInterval(window.__hexaRenderPerfTimer);
      let prev = {
        fullDraw: drawDebugStats.fullDraw,
        dragDraw: drawDebugStats.dragDraw,
        fullDrawMs: renderPerfStats.fullDrawMs,
        selectedPulseMs: renderPerfStats.selectedPulseMs,
        dragFrameMs: renderPerfStats.dragFrameMs,
        drawPieceCalls: renderPerfStats.drawPieceCalls,
        drawnHexCells: renderPerfStats.drawnHexCells,
        actionAnimationFrames: renderPerfStats.actionAnimationFrames,
        selectedPulseFrames: renderPerfStats.selectedPulseFrames,
        dragFrames: renderPerfStats.dragFrames,
        staticLayerBuilds: renderPerfStats.staticLayerBuilds,
        staticLayerBuildMs: renderPerfStats.staticLayerBuildMs
      };
      window.__hexaRenderPerfTimer = setInterval(() => {
        const now = {
          fullDraw: drawDebugStats.fullDraw,
          dragDraw: drawDebugStats.dragDraw,
          fullDrawMs: renderPerfStats.fullDrawMs,
          selectedPulseMs: renderPerfStats.selectedPulseMs,
          dragFrameMs: renderPerfStats.dragFrameMs,
          drawPieceCalls: renderPerfStats.drawPieceCalls,
          drawnHexCells: renderPerfStats.drawnHexCells,
          actionAnimationFrames: renderPerfStats.actionAnimationFrames,
          selectedPulseFrames: renderPerfStats.selectedPulseFrames,
          dragFrames: renderPerfStats.dragFrames,
          staticLayerBuilds: renderPerfStats.staticLayerBuilds,
          staticLayerBuildMs: renderPerfStats.staticLayerBuildMs
        };
        const fullDraws = now.fullDraw - prev.fullDraw;
        const selectedPulseFrames = now.selectedPulseFrames - prev.selectedPulseFrames;
        const dragFrames = now.dragFrames - prev.dragFrames;
        const staticLayerBuilds = now.staticLayerBuilds - prev.staticLayerBuilds;
        console.log({
          fullDraws,
          dragDraws: now.dragDraw - prev.dragDraw,
          actionAnimationFrames: now.actionAnimationFrames - prev.actionAnimationFrames,
          selectedPulseFrames,
          dragFrames,
          staticLayerBuilds,
          avgFullDrawMs: fullDraws ? Number(((now.fullDrawMs - prev.fullDrawMs) / fullDraws).toFixed(2)) : 0,
          avgSelectedPulseMs: selectedPulseFrames ? Number(((now.selectedPulseMs - prev.selectedPulseMs) / selectedPulseFrames).toFixed(2)) : 0,
          avgDragFrameMs: dragFrames ? Number(((now.dragFrameMs - prev.dragFrameMs) / dragFrames).toFixed(2)) : 0,
          avgStaticLayerBuildMs: staticLayerBuilds ? Number(((now.staticLayerBuildMs - prev.staticLayerBuildMs) / staticLayerBuilds).toFixed(2)) : 0,
          drawPieceCalls: now.drawPieceCalls - prev.drawPieceCalls,
          drawnHexCells: now.drawnHexCells - prev.drawnHexCells,
          maxFullDrawMs: Number(renderPerfStats.maxFullDrawMs.toFixed(2)),
          maxSelectedPulseMs: Number(renderPerfStats.maxSelectedPulseMs.toFixed(2)),
          maxDragFrameMs: Number(renderPerfStats.maxDragFrameMs.toFixed(2)),
          maxStaticLayerBuildMs: Number(renderPerfStats.maxStaticLayerBuildMs.toFixed(2)),
          activeAnimations: pieces.filter(p => p.actionAnim).length,
          selected: !!selected,
          drag: !!drag,
          dragLayerReady,
          dragLayerPieceId: dragLayerPiece ? dragLayerPiece.id : null
        });
        prev = now;
      }, ms);
      return "render perf logging started";
    },
    stopRenderPerfLog() {
      if (window.__hexaRenderPerfTimer) clearInterval(window.__hexaRenderPerfTimer);
      window.__hexaRenderPerfTimer = null;
      return "render perf logging stopped";
    }
    ,
    renderFlags: renderFeatureFlags,
    setRenderFlag(name, value) {
      if (!(name in renderFeatureFlags)) {
        console.warn("Unknown render flag", name, Object.keys(renderFeatureFlags));
        return { ...renderFeatureFlags };
      }
      renderFeatureFlags[name] = !!value;
      clearDragStaticLayer();
      draw();
      return { ...renderFeatureFlags };
    },
    setRenderFlags(nextFlags = {}) {
      for (const [name, value] of Object.entries(nextFlags)) {
        if (name in renderFeatureFlags) renderFeatureFlags[name] = !!value;
      }
      clearDragStaticLayer();
      draw();
      return { ...renderFeatureFlags };
    },
    resetRenderFlags() {
      for (const key of Object.keys(renderFeatureFlags)) renderFeatureFlags[key] = true;
      if (isMobileRenderDevice()) {
        renderFeatureFlags.mineralTexture = false;
      }
      clearDragStaticLayer();
      draw();
      return { ...renderFeatureFlags };
    },
    disableAllRenderDetails() {
      for (const key of Object.keys(renderFeatureFlags)) renderFeatureFlags[key] = false;
      clearDragStaticLayer();
      draw();
      return { ...renderFeatureFlags };
    }
  };

  window.addEventListener("resize", resize);
  loadTheme();
  updatePieceUI();
  showHome();
  canvas.addEventListener("pointerdown", () => {
    interactionPerfStats.lastPointerDownAt = performance.now();
  }, { capture: true, passive: true });

  canvas.addEventListener("pointermove", () => {
    interactionPerfStats.lastPointerMoveAt = performance.now();
  }, { capture: true, passive: true });

  canvas.addEventListener("pointerup", () => {
    interactionPerfStats.lastPointerUpAt = performance.now();
  }, { capture: true, passive: true });


})();
</script>
</body>
</html>
